name: Delete 1NCE Orderconfirmation.pdf

on:
  schedule:
    - cron: "30 4 * * *"   # daily 04:30 UTC (10:00 IST)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only list files, don't delete"
        type: choice
        options: ["true", "false"]
        default: "true"

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    concurrency: zoho-1nce-cleanup
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.3
      - name: Run cleanup
        env:
          ZOHO_CLIENT_ID: ${{ secrets.ZOHO_CLIENT_ID }}
          ZOHO_CLIENT_SECRET: ${{ secrets.ZOHO_CLIENT_SECRET }}
          ZOHO_REFRESH_TOKEN: ${{ secrets.ZOHO_REFRESH_TOKEN }}
          ZOHO_DC: us
          # Scheduled runs delete; manual runs default to dry run.
          DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run }}
        run: python main.py
      - name: Keep the deletion log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deletion-log
          path: deleted_*.csv
          if-no-files-found: ignore
          retention-days: 90
